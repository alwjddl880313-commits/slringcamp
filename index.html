<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#121212">
<meta name="description" content="하루 한 경기, 운동으로 승패를 기록하고 선수 스티커를 모으는 나만의 운동 기록 앱">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon-96.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="스프링캠프">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>나만의 스프링캠프</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&family=Roboto+Mono:wght@500;700&display=swap">
<style>
/* Layout: scoreboard band on top, single column of cards, fixed bottom tab bar (phone-first). */
:root{
  --bg:#f2f3f7; --surface:#ffffff; --sunk:#eceef4; --ink:#13203a; --muted:#646e86; --line:#dde1ea;
  --red:#c8102e; --red-ink:#ffffff; --red-soft:#fbe7ea; --gold:#e3a91f; --silver:#a9b1c0; --bronze:#c07b4a;
  --loss:#7d869a; --loss-soft:#e9ebf0; --rain:#2c6db0; --rain-soft:#e4eef9;
  --board:#10233f; --board-2:#1c3a63; --board-ink:#ffffff; --board-muted:#b9c7dc; --board-line:#ffffff24;
  --display:'Black Han Sans','Noto Sans KR',system-ui,sans-serif;
  --body:'Noto Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo',sans-serif;
  --mono:'Roboto Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c111c; --surface:#151c2b; --sunk:#1c2537; --ink:#e8ecf4; --muted:#97a1b6; --line:#273149;
  --red:#ec3a52; --red-ink:#ffffff; --red-soft:#3a1820; --gold:#f0bf45; --silver:#8f99ab; --bronze:#cf8b5a;
  --loss:#79839a; --loss-soft:#232c3f; --rain:#5e9fe6; --rain-soft:#18283f;
  --board:#0a1628; --board-2:#13294a; --board-ink:#ffffff; --board-muted:#9fb0ca; --board-line:#ffffff24; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c111c; --surface:#151c2b; --sunk:#1c2537; --ink:#e8ecf4; --muted:#97a1b6; --line:#273149;
  --red:#ec3a52; --red-ink:#ffffff; --red-soft:#3a1820; --gold:#f0bf45; --silver:#8f99ab; --bronze:#cf8b5a;
  --loss:#79839a; --loss-soft:#232c3f; --rain:#5e9fe6; --rain-soft:#18283f;
  --board:#0a1628; --board-2:#13294a; --board-ink:#ffffff; --board-muted:#9fb0ca; --board-line:#ffffff24; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#view{padding-bottom:96px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* scoreboard */
.board{background:linear-gradient(165deg,var(--board) 55%,var(--board-2));color:var(--board-ink);border-top:4px solid var(--red)}
.board .wrap{padding-block:18px 20px;display:grid;gap:14px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:14px;color:var(--board-muted)}
.brand .edit{margin-left:auto;color:var(--board-muted);text-decoration:none;font-size:12px;border:1px solid var(--board-line);border-radius:999px;padding:4px 10px}
.ball{width:22px;height:22px;flex:none}
.slogan{font-family:var(--display);font-size:32px;line-height:1.12;letter-spacing:.5px;text-wrap:balance;overflow-wrap:anywhere}
.slogan em{font-style:normal;color:var(--red)}
.slogan-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.slogan-row .slogan{min-width:0;flex:1}
.dday{flex:none;display:grid;justify-items:center;gap:1px;background:var(--red);color:var(--red-ink);border-radius:10px;padding:6px 10px 7px;line-height:1.1}
.dday small{font-size:10px;font-weight:700;letter-spacing:.06em;opacity:.85}
.dday b{font-family:var(--mono);font-weight:700;font-size:18px;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.dday.light b{font-size:15px}
.dday.empty{background:transparent;border:1px dashed var(--board-muted);color:var(--board-muted);text-decoration:none}
.cs i{font-style:normal;font-size:9px;font-weight:700;margin-left:1px}
.pricerow{display:grid;grid-template-columns:56px 96px minmax(0,1fr);gap:10px;align-items:center}
.pricein{display:flex;align-items:center;gap:6px}.pricein input{text-align:center}
.score{display:grid;grid-template-columns:1.1fr 1fr 1fr;border:1px solid var(--board-line);border-radius:12px;overflow:hidden}
.score>div{padding:10px 12px;display:grid;gap:2px;min-width:0}
.score>div+div{border-left:1px solid var(--board-line)}
.score .lbl{font-size:11px;letter-spacing:.08em;color:var(--board-muted)}
.score b{font-family:var(--display);font-weight:400;font-size:20px;white-space:nowrap}
.score b.mono{font-family:var(--mono);font-weight:700;color:var(--board-ink)}
.score .pctbar{height:3px;width:28px;background:var(--red);border-radius:2px}
.score small{font-size:11px;color:var(--board-muted)}

/* generic */
.page{display:grid;gap:14px;padding-top:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.card h2{font-size:16px;margin:0}
.head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.muted{color:var(--muted);font-size:13px}
.title{font-family:var(--display);font-weight:400;font-size:24px;margin:0;text-wrap:balance}
.back{display:inline-flex;align-items:center;gap:4px;color:var(--muted);text-decoration:none;font-size:14px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-weight:700;color:var(--ink)}
.btn.primary{background:var(--red);border-color:var(--red);color:var(--red-ink)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--red);border-color:var(--red)}
.btn.block{width:100%;padding:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.icon-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:18px;line-height:1}
.icon-btn:disabled{opacity:.35;cursor:default}
.notice{background:var(--sunk);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--muted)}
input[type=number],input[type=text],input[type=date],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:9px 10px;width:100%;min-width:0}
textarea{min-height:90px;font-family:var(--mono);font-size:12px}
label.fld{display:grid;gap:4px;font-size:12px;color:var(--muted);min-width:0}

/* result badges */
.res{display:inline-grid;place-items:center;min-width:44px;padding:3px 10px;border-radius:8px;font-family:var(--display);font-size:18px}
.res.W{background:var(--red);color:var(--red-ink)}
.res.L{background:var(--loss-soft);color:var(--loss)}
.res.R{background:var(--rain-soft);color:var(--rain)}
.res.P{background:var(--sunk);color:var(--muted);font-family:var(--body);font-size:13px;font-weight:700}

/* stickers */
.stk{width:40px;height:40px;border-radius:50%;display:inline-grid;place-items:center;border:3px solid var(--gold);background:var(--sunk);overflow:hidden;flex:none;font-weight:700;font-size:12px;letter-spacing:-.02em}
.stk img{width:100%;height:100%;object-fit:cover}
.stk.silver{border-color:var(--silver)}.stk.bronze{border-color:var(--bronze)}
.stk.minus{border-color:var(--loss);filter:grayscale(1);opacity:.75}
.stk.sm{width:30px;height:30px;font-size:10px;border-width:2px}
.stickers{display:flex;gap:6px;flex-wrap:wrap}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.wd{text-align:center;font-size:11px;color:var(--muted);padding-bottom:2px}
.cell{border:1px solid var(--line);background:var(--surface);border-radius:9px;min-height:62px;padding:5px 4px;display:grid;align-content:start;justify-items:center;gap:3px;min-width:0}
.cell:disabled{cursor:default;background:transparent;opacity:.55}
.cell .n{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.cell.today{border:2px solid var(--red)}
.cell.off{background:transparent;border-style:dashed}
.b{font-style:normal;font-family:var(--display);font-size:13px;line-height:1;padding:3px 5px;border-radius:5px}
.b.W{background:var(--red);color:var(--red-ink)}
.b.L{background:var(--loss-soft);color:var(--loss)}
.b.L.auto{background:transparent;border:1px dashed var(--loss)}
.b.R{background:var(--rain-soft);color:var(--rain);font-size:11px}
.cell small{font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--muted);align-items:center}
.legend span{display:inline-flex;gap:5px;align-items:center}

/* record */
.datebar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.datebar .d{font-family:var(--display);font-size:22px;text-align:center;flex:1}
.preview{display:flex;align-items:center;gap:12px}
.preview p{margin:0;font-size:14px}
.exrow{display:grid;grid-template-columns:minmax(0,1fr) auto 40px;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.exrow:first-child{border-top:0}
.exinfo{min-width:0}
.exinfo b{display:block;font-size:15px}
.exinfo small{color:var(--muted);font-size:12px}
.exrow.ok .exinfo b::after{content:" ✓";color:var(--red)}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stepper button{width:36px;height:38px;border:0;background:var(--sunk);font-size:18px}
.stepper input{width:52px;border:0;border-radius:0;text-align:center;padding:8px 2px;font-family:var(--mono);-moz-appearance:textfield}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px}
.chip.on{background:var(--rain);border-color:var(--rain);color:#fff}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px}
.switch input{width:22px;height:22px;accent-color:var(--red)}

/* week */
.wkday{display:grid;grid-template-columns:72px 56px minmax(0,1fr);gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.wkday:first-child{border-top:0}
.wkday:disabled{cursor:default;opacity:.55}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-weight:500;color:var(--muted);font-size:12px}
.tablewrap{overflow-x:auto}

/* settings */
.menu{display:grid}
.menu a{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 2px;border-top:1px solid var(--line);color:var(--ink);text-decoration:none}
.menu a:first-child{border-top:0}
.menu a b{display:block;font-size:15px}
.menu a span.muted{display:block}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.exedit{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:14px 0;border-top:1px solid var(--line)}
.exedit:first-child{border-top:0;padding-top:0}
.inn{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:8px}
.inning{font-family:var(--display);font-size:20px;color:var(--red)}
.inn-tag{display:block;font-size:11px;font-weight:700;color:var(--red);letter-spacing:.04em}
.icon-btn.sm{width:32px;height:32px;font-size:16px}
.minus-btn{color:var(--red)}
.tierrow{display:grid;grid-template-columns:minmax(0,1fr) 72px auto 32px;gap:8px;align-items:center;padding:5px 0}
.tierrow.fixed{padding:10px 0 0;border-top:1px dashed var(--line);margin-top:6px;grid-template-columns:minmax(0,1fr) 72px auto 32px}
.tierrow.fixed>span:first-child{padding-left:10px;font-weight:700;color:var(--loss)}
.grp{padding:14px 0;border-top:1px solid var(--line);display:grid;gap:6px}
.grp:first-of-type{border-top:0;padding-top:0}
.grphead{display:grid;grid-template-columns:minmax(0,1fr) 32px;gap:8px;align-items:center;margin-bottom:4px}
.grphead input{font-weight:700}
.plrow{display:grid;grid-template-columns:84px minmax(0,1fr);gap:8px;align-items:center}
.plrow input{padding:7px 9px}
.imgrow{display:flex;align-items:center;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
.imgrow:first-child{border-top:0}
.imgrow .nm{flex:1;min-width:0}
.imgrow input[type=file]{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.filebtn{border:1px solid var(--line);border-radius:9px;padding:7px 10px;font-size:13px;font-weight:700;cursor:pointer;background:var(--surface)}


/* reward: stickers, dex, sheet */
.ico{width:18px;height:18px;flex:none;vertical-align:-3px}
.schip{display:inline-flex;align-items:center;gap:4px;color:var(--red);font-weight:700}
.schip b{font-family:var(--display);font-weight:400;font-size:22px;color:var(--ink);font-variant-numeric:tabular-nums}
.schip.s-ball{color:var(--rain)}
.period{display:grid;grid-template-columns:52px minmax(0,1fr);gap:12px;align-items:center;background:linear-gradient(165deg,var(--board) 55%,var(--board-2));color:var(--board-ink);border-radius:14px;padding:14px 16px}
.period .pico{width:52px;height:52px;border-radius:14px;background:var(--red);color:var(--red-ink);display:grid;place-items:center}
.period .pico .ico{width:30px;height:30px}
.period small{display:block;font-size:11px;color:var(--board-muted);letter-spacing:.06em}
.period b{display:block;font-family:var(--display);font-weight:400;font-size:22px;line-height:1.2}
.period span{display:block;font-size:12px;color:var(--board-muted)}
.wallet{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.wallet .wl{display:flex;align-items:center;gap:8px;background:var(--sunk);border-radius:10px;padding:10px 12px}
.wallet .wl-ico{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--surface);color:var(--red);flex:none}
.wallet .wl-ball .wl-ico{color:var(--rain)}
.wallet .wl b{display:block;font-family:var(--display);font-weight:400;font-size:24px;line-height:1;font-variant-numeric:tabular-nums}
.wallet .wl small{font-size:12px;color:var(--muted)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--sunk);border-radius:12px;padding:4px;gap:4px}
.seg>*{border:0;background:transparent;color:var(--muted);border-radius:9px;padding:9px 6px;font-weight:700;text-align:center;text-decoration:none;font-size:14px}
.seg>[aria-selected=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px #0002}
.seg.small>*{padding:7px 6px;font-size:13px}
.progress{height:6px;border-radius:99px;background:var(--sunk);overflow:hidden;margin-bottom:6px}
.progress i{display:block;height:100%;background:var(--red)}
.grp-h{display:flex;justify-content:space-between;align-items:center;margin:16px 0 8px;font-size:14px}
.grp-h .price{display:inline-flex;align-items:center;gap:3px;color:var(--muted);font-size:13px;font-weight:700}
.pgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pcard{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:10px 6px 8px;display:grid;justify-items:center;gap:3px;min-width:0;text-align:center}
.pcard b{font-size:13px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard small{font-size:11px;color:var(--muted)}
.pcard .pimg{filter:grayscale(1);opacity:.55}
.pcard.own{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.pcard.own .pimg{filter:none;opacity:1;border-color:var(--gold)}
.pstate{display:inline-flex;align-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--red)}
.pcard.own .pstate{color:var(--muted)}
.pimg{width:56px;height:56px;border-radius:50%;border:2px solid var(--line);background:var(--sunk);overflow:hidden;display:grid;place-items:center;flex:none}
.pimg img{width:100%;height:100%;object-fit:cover}
.pimg .pname{font-family:var(--display);font-size:13px;line-height:1.1;padding:2px;text-align:center;word-break:keep-all;overflow-wrap:anywhere}
.pimg.sm{width:40px;height:40px}.pimg.sm .pname{font-size:10px}
.pimg.big{width:110px;height:110px;border-width:3px}.pimg.big .pname{font-size:22px}
#sheet{position:fixed;inset:0;z-index:40}
.sheet-bg{position:absolute;inset:0;background:#000a}
.sheet-in{position:absolute;left:0;right:0;bottom:0;background:var(--surface);color:var(--ink);border-radius:18px 18px 0 0;display:grid;gap:12px;max-width:640px;margin:0 auto;
  padding:20px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet-in p{margin:0}
.sheet-card{display:grid;justify-items:center;gap:6px;text-align:center}
.sheet-card h2{margin:0;font-family:var(--display);font-weight:400;font-size:28px}
.sheet-card small{color:var(--muted)}
.sheet-card .pimg{filter:grayscale(1)}
.sheet-card.own .pimg{filter:none;border-color:var(--gold)}
.got{font-family:var(--display);font-size:20px;color:var(--red)}
.reveal .pimg{animation:pop .5s ease-out}
@keyframes pop{0%{transform:scale(.4) rotate(-20deg);opacity:0}70%{transform:scale(1.12) rotate(4deg)}100%{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.reveal .pimg{animation:none}}
.rrow{display:grid;grid-template-columns:40px minmax(0,1fr) 70px 38px 32px;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.rrow:first-of-type{border-top:0}
.rrow input[type=file]{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.rrow input[type=text]{padding:7px 8px}
.rphoto{cursor:pointer}
.rg{font-size:11px;color:var(--muted);text-align:center;font-weight:700}
.linescore{display:grid;grid-template-columns:repeat(auto-fit,minmax(30px,1fr));gap:4px}
.ls{display:grid;justify-items:center;border-radius:8px;background:var(--sunk);padding:4px 0;font-variant-numeric:tabular-nums}
.ls small{font-size:10px;color:var(--muted)}
.ls b{font-size:13px;white-space:nowrap}.ls.k b{font-size:10px;line-height:19.5px}
.ls.ok b{color:var(--red)}.ls.k b{color:var(--loss)}
.gotline{display:flex;align-items:center;gap:6px;margin:10px 0 0;font-size:13px;font-weight:700}
.cs{font-style:normal;display:inline-flex;margin-left:2px;color:var(--red)}.cs.s-ball{color:var(--rain)}
.cs .ico{width:11px;height:11px;vertical-align:-1px}
.expct{font-size:12px;text-align:right;color:var(--muted)}.expct.ok{color:var(--red);font-weight:700}.expct.k{color:var(--loss)}
.sline{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);margin-top:4px}
.sline.on{color:var(--ink);font-weight:700}
/* team: LED lineup board + field */
.led{--led-bg:#0b0d0c;--led-fg:#ffd54a;--led-dim:#6b5a1e;--led-line:#1e2420;background:var(--led-bg);color:var(--led-fg);border-radius:14px;padding:14px 16px;border:4px solid #2a2f2c;box-shadow:inset 0 0 24px #000;font-family:var(--mono)}

<script>
/* ---------- dates (local time, no UTC shift) ---------- */
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)};
const todayStr=()=>ymd(new Date());
const weekStart=s=>{const d=parse(s);d.setDate(d.getDate()-(d.getDay()+6)%7);return ymd(d)};
const WD=['일','월','화','수','목','금','토'];
const fmtMD=s=>{const d=parse(s);return `${d.getMonth()+1}월 ${d.getDate()}일 (${WD[d.getDay()]})`};
const fmtShort=s=>{const d=parse(s);return `${d.getMonth()+1}/${d.getDate()}`};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=s=>document.querySelector(s);

/* ---------- state ---------- */
const KEY='springcamp.v2';
const RAIN_REASONS=['생리','질병','부상','기타'];
const UNIT_HINTS=['분','세트','회','개','km','시간','잔'];
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const inningLabel=i=>`${i+1}이닝`+(i>=9?' (연장)':'');
const SQUAT={id:'squat',name:'스쿼트',unit:'세트',daily:3};
/* 2026 season, KIA. OPS from yagoonara team records, WAR = yagoonara yWAR (checked 2026-11-06). '' = not found, user fills in */
const KIA_BATTERS=[['김도영',1.060],['카스트로',.928],['나성범',.920],['한준수',.822],['박재현',.802],['김선빈',.732],['김호령',.712],['김태군',.711],['하주석',.651],['김규성',.590],['박정우',''],['박상준',''],['아데를린',''],['주효상',''],['박민','']];
const KIA_PITCHERS=[['올러',5.28],['네일',5.20],['양현종',1.69],['시라카와',1.11],['전상현',1.09],['이태양',.80],['곽도규',.65],['조상우',.63],['성영탁',.55],['정해영',''],['이의리',''],['김범수',''],['김태형',''],['최지민',''],['황동하','']];
const emptyLineup=()=>({order:[...Array(9)].map(()=>({id:null,pos:null})),sp:null});
function defaults(){
  return{
  season:{start:todayStr()},
  exercises:[
    {id:'stretch',name:'스트레칭',unit:'분',daily:10},
    {id:'run',name:'달리기',unit:'분',daily:30},
    {id:'burpee',name:'슬로우버피',unit:'세트',daily:5},
    {id:'knee',name:'무릎대고 운동',unit:'세트',daily:3},
    {id:'mountain',name:'마운틴 클라이머',unit:'세트',daily:3},
    {id:'kick',name:'버피킥',unit:'세트',daily:3},
    {id:'plank',name:'플랭크',unit:'세트',daily:3},
    {...SQUAT},
    {id:'sleep',name:'수면 (23시 취침)',unit:'회',daily:1}],
  rule:{satisfyPct:100,winNeed:6},
  team:'KIA 타이거즈',
  reward:{periodDays:14,firstType:'bat',missPenalty:true,groupSize:3,prices:[8,7,5,4,3],v3:true,v4:true},
  batters:KIA_BATTERS.map(([name,stat],i)=>({id:'b'+(i+1),name,stat})),
  pitchers:KIA_PITCHERS.map(([name,stat],i)=>({id:'p'+(i+1),name,stat})),
  owned:{},photos:{},lineup:emptyLineup(),
  home:{slogan:'최강기아 승리하리라',profile:{nick:'',from:'',age:'',etc:'',photo:''}},
  theme:{bg:'#121212',fg:'#ffffff',accent:'#c8102e'},
  nextSeason:'',
  fonts:{display:'blackhan',body:'noto'},
  customFont:null,
  onboarded:false,
  records:{}}}
function migrate(x){
  if(!x||typeof x!=='object')return defaults();
  const d=defaults();
  if(x.onboarded===undefined)x.onboarded=true;
  if(!x.reward){
    const imgs=x.images||{};x.photos={};
    [...d.batters,...d.pitchers].forEach(p=>{if(imgs[p.name])x.photos[p.id]=imgs[p.name]});
    delete x.tiers;delete x.groups;delete x.grades;delete x.players;delete x.images;
    x.exercises=(x.exercises||d.exercises).map(({type,group,...e})=>e);
    if(x.exercises.length===8&&x.exercises[7].id==='sleep'&&!x.exercises.some(e=>e.id==='squat'))x.exercises.splice(7,0,{...SQUAT});
    const m={...d,...x};
    Object.values(m.records||{}).forEach(r=>{r.ex=(r.ex||[]).map(({type,group,...e})=>e)});
    m._backfill=true;
    return m;
  }
  return{...d,...x};
}
let S;
try{S=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){S=null}
S=migrate(S);
if(!S.reward.prices){S.reward={...S.reward,bonusAt:100,prices:[8,7,5,4,3]};S._backfill=true}
if(!S.reward.noOutRule){S.reward={...S.reward,noOutRule:true};S._backfill=true}
if(!S.reward.v3){S.reward={...S.reward,missPenalty:true,v3:true};delete S.reward.threshold;delete S.reward.bonusAt;S._backfill=true}
/* outs no longer cost stickers; only unrecorded days do */
/* new default prices; keep any prices the user changed themselves */
if(S.reward.prices&&S.reward.prices.join()==='7,4,3,2,1')S.reward={...S.reward,prices:[8,7,5,4,3]};
if(!S.reward.v4){S.reward={...S.reward,missPenalty:true,v4:true};delete S.reward.outLimit;S._backfill=true}
if(!S.lineup)S.lineup=emptyLineup();
function persist(){try{localStorage.setItem(KEY,JSON.stringify(S));return true}catch(e){toast('저장하지 못했어요. 사진 수를 줄여 보세요.');return false}}
let toastT;function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('show'),2000)}

/* ---------- game logic ---------- */
function currentEx(){return S.exercises.map(e=>({id:e.id,name:e.name,unit:e.unit,t:Math.max(0,Number(e.daily)||0)}))}
function evalRecord(r){
  const rule=r.rule||S.rule;
  const items=r.ex.map(x=>{const a=Math.max(0,Number(r.vals[x.id])||0);const pct=x.t>0?Math.min(100,a/x.t*100):100;
    const strike=x.t>0&&a===0;const ok=!strike&&pct>=rule.satisfyPct;
    return{...x,a,pct,ok,strike}});
  const okN=items.filter(i=>i.ok).length,strikes=items.filter(i=>i.strike).length;
  const need=Math.min(rule.winNeed,items.length);
  return{items,okN,strikes,need,win:okN>=need,total:items.length,rule};
}
function dayStatus(d){
  const T=todayStr(),r=S.records[d];
  if(d>T)return{s:'future'};
  if(d<S.season.start)return{s:'off'};
  if(!r)return d===T?{s:'pending'}:{s:'L',auto:true};
  if(r.rainout)return{s:'R',r};
  const ev=evalRecord(r);return{s:ev.win?'W':'L',ev,r};
}
function tally(from,to){let W=0,L=0,R=0;for(let d=from;d<=to;d=addDays(d,1)){const x=dayStatus(d);if(x.s==='W')W++;else if(x.s==='L')L++;else if(x.s==='R')R++}return{W,L,R,pct:W+L?W/(W+L):null}}
const fmtPct=p=>p==null?'-.---':p>=1?'1.000':p.toFixed(3).slice(1);
/* ---------- reward: bat/ball stickers, alternating periods, buying players ---------- */
const BAT_SVG='<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 3.5c-1-1-2.6-.9-3.6.1L8.6 12l3.4 3.4 8.4-8.3c1-1 1.1-2.6.1-3.6z"/><path d="M8.6 12l-1.3 1.3M10.7 14.1l-1.3 1.3"/><path d="M7.3 13.3l3.4 3.4-2.9 2.9a1.2 1.2 0 0 1-1.7 0l-1.7-1.7a1.2 1.2 0 0 1 0-1.7z"/><circle cx="4" cy="20" r="1.2"/></svg>';
const BALL_SVG='<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M7 5.5c2 2.2 2 10.8 0 13M17 5.5c-2 2.2-2 10.8 0 13"/></svg>';
const TYPE={
  bat:{label:'타자',stat:'OPS',list:'batters',sticker:'방망이',icon:BAT_SVG,fmt:v=>v==null||v===''?'—':Number(v).toFixed(3).replace(/^0(?=\.)/,'')},
  ball:{label:'투수',stat:'WAR',list:'pitchers',sticker:'야구공',icon:BALL_SVG,fmt:v=>v==null||v===''?'—':Number(v).toFixed(2)}};
const other=t=>t==='bat'?'ball':'bat';
function periodOf(d){const R=S.reward,len=Math.max(1,R.periodDays|0),days=Math.max(0,Math.round((parse(d)-parse(S.season.start))/864e5)),idx=Math.floor(days/len),start=addDays(S.season.start,idx*len);
  return{type:idx%2===0?R.firstType:other(R.firstType),idx,start,end:addDays(start,len-1)}}
/* old records get stickers under the default rule once, after all code has loaded */
function backfillStickers(){if(!S._backfill)return;delete S._backfill;Object.entries(S.records).forEach(([date,r])=>applySticker(r,date));persist()}
function rateOf(ev){return ev.items.length?ev.items.reduce((a,i)=>a+i.pct,0)/ev.items.length:0}
/* stickers: a win earns 1, all innings met earns 1 more; a day left unrecorded takes 1 away.
   The period type and out limit are frozen on the record when it is saved. */
const ruleNow=date=>({type:periodOf(date).type});
const nOf=r=>r&&r.sticker?(r.stickerN||1):0;
function stickerCalc(ev,rule,rainout){if(rainout)return{n:0,pen:0};const n=ev.win?(ev.okN===ev.total?2:1):0;return{n,pen:0}}
function applySticker(r,date,rule){r.stickerRule=rule||ruleNow(date);const{n,pen}=stickerCalc(evalRecord(r),r.stickerRule,r.rainout);r.sticker=n?r.stickerRule.type:null;r.stickerN=n;r.penalty=pen}
function missedDays(){if(!S.reward.missPenalty)return[];const out=[],T=todayStr();for(let d=S.season.start;d<T;d=addDays(d,1))if(!S.records[d])out.push(d);return out}
/* net change of one day: {type, n} (n may be negative), or null */
function dayNet(date){const r=S.records[date];
  if(r){if(r.rainout||!r.stickerRule)return null;const n=nOf(r)-(r.penalty||0);return{type:r.stickerRule.type,n,gain:nOf(r),pen:r.penalty||0}}
  if(S.reward.missPenalty&&date>=S.season.start&&date<todayStr())return{type:periodOf(date).type,n:-1,gain:0,pen:1,missed:true};return null}
const signed=n=>n>0?`+${n}`:n<0?`−${-n}`:'0';
const fmtCount=n=>n<0?`−${-n}`:String(n);
function wallet(){const w={bat:0,ball:0};Object.values(S.records).forEach(r=>{if(r.sticker)w[r.sticker]+=nOf(r);if(r.penalty&&r.stickerRule&&!r.rainout)w[r.stickerRule.type]-=r.penalty});
  missedDays().forEach(d=>w[periodOf(d).type]--);
  Object.values(S.owned).forEach(o=>{w[o.type]-=o.cost});return w}
function earned(){const w={bat:0,ball:0};Object.values(S.records).forEach(r=>{if(r.sticker)w[r.sticker]+=nOf(r)});return w}
const priceOfR=(R,g)=>Math.max(1,(R.reward.prices||[8,7,5,4,3])[g-1]|0);
const priceOf=g=>Math.max(1,(S.reward.prices||[8,7,5,4,3])[g-1]|0);
function groupsOf(type){const n=Math.max(1,S.reward.groupSize|0),val=p=>p.stat===''||p.stat==null||isNaN(Number(p.stat))?-Infinity:Number(p.stat);
  return[...S[TYPE[type].list]].sort((a,b)=>val(b)-val(a)).map((p,i)=>({...p,type,group:i<n*5?Math.floor(i/n)+1:null}))}
const findPlayer=id=>groupsOf('bat').concat(groupsOf('ball')).find(p=>p.id===id);
const initials=n=>!n?'?':n==='카스트로'?'카스':n.length<=2?n:n.slice(-2);
function photoHtml(p,cls='pimg'){const src=S.photos[p.id];return `<span class="${cls}">${src?`<img src="${src}" alt="${esc(p.name)}">`:`<span class="pname">${esc(p.name)}</span>`}</span>`}
const stickerChip=(t,n)=>`<span class="schip s-${t}">${TYPE[t].icon}${n!=null?`<b>${n}</b>`:''}</span>`;
const badge=s=>s.s==='W'?'<span class="res W">승</span>':s.s==='L'?'<span class="res L">패</span>':s.s==='R'?'<span class="res R">우취</span>':'<span class="res P">경기 전</span>';

/* ---------- home ---------- */
let viewMonth=(()=>{const d=new Date();return{y:d.getFullYear(),m:d.getMonth()}})();
function renderHome(){
  const T=todayStr(),season=tally(S.season.start,T),week=tally(weekStart(T),T),ts=dayStatus(T);
  let today;
  if(ts.s==='pending')today=`<p class="muted" style="margin:0">아직 기록 전이에요</p>`;
  else if(ts.s==='R')today=`<p style="margin:0">우천취소 · ${esc(ts.r.rainout.reason)}${ts.r.rainout.memo?` · ${esc(ts.r.rainout.memo)}`:''}</p>`;
  else today=`<p class="muted" style="margin:0 0 10px">만족 ${ts.ev.okN}/${ts.ev.total}${ts.ev.strikes?` · 아웃 ${ts.ev.strikes}`:''} · 전체 달성률 ${Math.round(rateOf(ts.ev))}%</p>${lineScore(ts.ev)}${(()=>{const dn=dayNet(T);return dn&&dn.n?`<p class="gotline ${dn.n<0?'neg':''}">${stickerChip(dn.type)} ${TYPE[dn.type].sticker} ${signed(dn.n)}${dn.pen?` · 아웃 ${ts.ev.strikes}개`:''}</p>`:''})()}`;
  $('#view').innerHTML=`
  ${heroHtml(S.home)}
  <div class="wrap page">
    <section class="card"><div class="head"><h2>오늘 · ${fmtMD(T)}</h2>${badge(ts)}</div>${today}</section>
    <section class="card">
      <div class="head"><button class="icon-btn" onclick="moveMonth(-1)" aria-label="이전 달">‹</button><h2>${viewMonth.y}년 ${viewMonth.m+1}월</h2><button class="icon-btn" onclick="moveMonth(1)" aria-label="다음 달">›</button></div>
      <div class="cal">${calendarHtml()}</div>
      <div class="legend"><span><i class="b W">승</i>승리</span><span><i class="b L">패</i>패배</span><span><i class="b L auto">패</i>미기록 패</span><span><i class="b R">우취</i>우천취소</span></div>
    </section>
  </div>`;
}
function lineScore(ev){return `<div class="linescore">${ev.items.map((i,n)=>`<span class="ls ${i.ok?'ok':i.strike?'k':'part'}" title="${esc(i.name)} ${Math.round(i.pct)}%"><small>${n+1}</small><b>${i.ok?'●':i.strike?'아웃':Math.round(i.pct)}</b></span>`).join('')}</div>`}
function calendarHtml(){
  const{y,m}=viewMonth,T=todayStr(),lead=(new Date(y,m,1).getDay()+6)%7,days=new Date(y,m+1,0).getDate();
  let h=['월','화','수','목','금','토','일'].map(w=>`<div class="wd">${w}</div>`).join('');
  for(let i=0;i<lead;i++)h+='<div></div>';
  for(let d=1;d<=days;d++){const ds=ymd(new Date(y,m,d)),st=dayStatus(ds);
    let b='',sub='';
    if(st.s==='W'||st.s==='L'){b=`<i class="b ${st.s}${st.auto?' auto':''}">${st.s==='W'?'승':'패'}</i>`;sub=st.ev?`${st.ev.okN}/${st.ev.total}`:'미기록'}
    else if(st.s==='R'){b='<i class="b R">우취</i>';sub=esc(st.r.rainout.reason)}
    else if(st.s==='pending'){sub='기록 전'}
    h+=`<button class="cell ${ds===T?'today':''} ${st.s==='off'?'off':''}" ${st.s==='future'?'disabled':''} onclick="openDay('${ds}')" aria-label="${fmtMD(ds)}"><span class="n">${d}${(()=>{const dn=dayNet(ds);return dn&&dn.n?`<em class="cs s-${dn.type} ${dn.n<0?'neg':''}">${TYPE[dn.type].icon}${dn.n!==1?`<i>${signed(dn.n)}</i>`:''}</em>`:''})()}</span>${b}<small>${sub}</small></button>`}
  return h;
}
function moveMonth(n){let m=viewMonth.m+n,y=viewMonth.y;if(m<0){m=11;y--}if(m>11){m=0;y++}viewMonth={y,m};renderHome()}
function openDay(d){if(d>todayStr())return;cur.date=d;cur.draft=null;if(location.hash==='#record')route();else location.hash='record'}

/* ---------- daily record ---------- */
let cur={date:todayStr(),draft:null};
function draftFor(d){const r=S.records[d];
  if(r)return{date:d,ex:r.ex.map(x=>({...x})),vals:{...r.vals},rule:{...r.rule},rainout:r.rainout?{...r.rainout}:null,existing:true};
  return{date:d,ex:currentEx(),vals:{},rule:{...S.rule},rainout:null,existing:false}}
function renderRecord(){
  const T=todayStr();if(cur.date>T)cur.date=T;
  if(!cur.draft||cur.draft.date!==cur.date)cur.draft=draftFor(cur.date);
  const D=cur.draft;
  $('#view').innerHTML=`<div class="wrap page">
    <section class="card"><div class="datebar">
      <button class="icon-btn" onclick="shiftDay(-1)" aria-label="전날">‹</button>
      <div class="d">${fmtMD(cur.date)}</div>
      <button class="icon-btn" onclick="shiftDay(1)" aria-label="다음날" ${cur.date>=T?'disabled':''}>›</button></div>
      ${cur.date<S.season.start?`<p class="notice" style="margin:12px 0 0">기록 시작일(${S.season.start}) 이전 날짜예요. 저장하면 기록 시작일이 이 날짜로 당겨져요.</p>`:''}
    </section>
    <section class="card"><div class="preview" id="preview"></div></section>
    <section class="card" id="exlist" ${D.rainout?'style="opacity:.45"':''}>
      ${D.ex.map((x,xi)=>`<div class="exrow" id="row-${x.id}">
        <div class="exinfo"><small class="inn-tag">${inningLabel(xi)}</small><b>${esc(x.name)}</b><small>목표 ${x.t}${esc(x.unit)}</small></div>
        <div class="stepper"><button onclick="step('${x.id}',-1)" aria-label="${esc(x.name)} 줄이기">−</button><input id="v-${x.id}" type="number" inputmode="numeric" min="0" placeholder="0" value="${D.vals[x.id]??''}" oninput="setVal('${x.id}',this.value)" aria-label="${esc(x.name)} 기록"><button onclick="step('${x.id}',1)" aria-label="${esc(x.name)} 늘리기">+</button></div>
        <div class="expct mono" id="s-${x.id}"></div></div>`).join('')}
    </section>
    <section class="card">
      <label class="switch"><span><b>특이사항으로 우천취소</b></span><input type="checkbox" id="rainToggle" ${D.rainout?'checked':''} onchange="toggleRain(this.checked)"></label>
      ${D.rainout?`<div style="display:grid;gap:10px;margin-top:12px"><div class="chips">${RAIN_REASONS.map(r=>`<button class="chip ${D.rainout.reason===r?'on':''}" onclick="setReason('${r}')">${r}</button>`).join('')}</div>
      <input type="text" id="rainMemo" placeholder="메모 (선택)" value="${esc(D.rainout.memo||'')}" oninput="cur.draft.rainout.memo=this.value"></div>`:''}
    </section>
    <button class="btn primary block" onclick="saveRecord()">${D.existing?'기록 수정하기':'기록 저장하기'}</button>
    ${D.existing?`<div class="row"><button class="btn ghost" style="flex:1" onclick="resyncTargets()">지금 목표로 다시 계산</button><button class="btn danger" style="flex:1" id="delBtn" onclick="deleteRecord(this)">기록 삭제</button></div>`:''}
  </div>`;
  updatePreview();
}
function updatePreview(){
  const D=cur.draft,ev=evalRecord(D);
  ev.items.forEach(i=>{const s=$('#s-'+i.id);if(s){s.textContent=i.strike?'아웃':Math.round(i.pct)+'%';s.className='expct mono '+(i.ok?'ok':i.strike?'k':'')}const r=$('#row-'+i.id);if(r)r.classList.toggle('ok',i.ok)});
  let res,msg;
  if(D.rainout){res='<span class="res R">우취</span>';msg=`우천취소 (${esc(D.rainout.reason)}) · 승률에 반영되지 않아요`}
  else if(ev.win){res='<span class="res W">승</span>';msg=`목표 만족 <b>${ev.okN}/${ev.total}</b> · 승리 기준 ${ev.need}개 충족`}
  else{res='<span class="res L">패</span>';msg=`목표 만족 <b>${ev.okN}/${ev.total}</b> · 승리까지 ${ev.need-ev.okN}개 더`}
  const sr=(S.records[D.date]&&S.records[D.date].stickerRule)||ruleNow(D.date),{n,pen}=stickerCalc(ev,sr,D.rainout),nm=TYPE[sr.type].sticker;
  const sline=D.rainout?'':`${stickerChip(sr.type)} ${nm} ${signed(n)} · `+(n===2?`승리 + ${ev.total}이닝 모두 채움`:n===1?'승리 · 모두 채우면 1개 더':'패한 날은 스티커 없음');
  $('#preview').innerHTML=`${res}<p>${msg}${!D.rainout&&ev.strikes?`<br><span class="muted">아웃 ${ev.strikes}</span>`:''}${sline?`<br><span class="sline ${n-pen>0?'on':n-pen<0?'neg':''}">${sline}</span>`:''}</p>`;
}
function stepSize(id){const x=cur.draft.ex.find(e=>e.id===id);return x&&x.unit==='분'?5:1}
function step(id,dir){const D=cur.draft;const v=Math.max(0,(Number(D.vals[id])||0)+dir*stepSize(id));D.vals[id]=v;$('#v-'+id).value=v;updatePreview()}
function setVal(id,v){cur.draft.vals[id]=v===''?'':Math.max(0,Number(v)||0);updatePreview()}
function shiftDay(n){const d=addDays(cur.date,n);if(d>todayStr())return;cur.date=d;cur.draft=null;renderRecord()}
function toggleRain(on){cur.draft.rainout=on?{reason:'생리',memo:''}:null;renderRecord()}
function setReason(r){cur.draft.rainout.reason=r;renderRecord()}
function resyncTargets(){const D=cur.draft;D.ex=currentEx();D.rule={...S.rule};renderRecord();toast('현재 목표와 규칙으로 다시 계산했어요. 저장하면 반영돼요.')}
function saveRecord(){
  const D=cur.draft,vals={};D.ex.forEach(x=>vals[x.id]=Math.max(0,Number(D.vals[x.id])||0));
  const rec={ex:D.ex,vals,rule:D.rule,rainout:D.rainout?{reason:D.rainout.reason,memo:D.rainout.memo||''}:null,savedAt:Date.now()};
  const prev=S.records[D.date];applySticker(rec,D.date,prev&&prev.stickerRule?prev.stickerRule:null);
  S.records[D.date]=rec;
  let moved=false;if(D.date<S.season.start){S.season.start=D.date;moved=true}
  if(!persist())return;
  const st=dayStatus(D.date);cur.draft=null;renderRecord();
  const dn=dayNet(D.date);
  toast((st.s==='W'?'승리! ':st.s==='R'?'우천취소로 ':'패배. ')+'기록을 저장했어요'+(dn&&dn.n?` · ${TYPE[dn.type].sticker} ${signed(dn.n)}`:'')+(moved?' · 기록 시작일도 옮겼어요':''));
}
function deleteRecord(btn){if(!btn.dataset.armed){btn.dataset.armed=1;btn.textContent='한 번 더 누르면 삭제';setTimeout(()=>{if(btn.isConnected){delete btn.dataset.armed;btn.textContent='기록 삭제'}},3000);return}
  delete S.records[cur.date];persist();cur.draft=null;renderRecord();toast('기록을 삭제했어요')}

/* ---------- week ---------- */
let viewWeek=weekStart(todayStr());
function renderWeek(){
  const T=todayStr(),ws=viewWeek,we=addDays(ws,6),t=tally(ws,we<T?we:T);
  let days='';for(let i=0;i<7;i++){const d=addDays(ws,i),st=dayStatus(d);
    let info=st.s==='future'?'예정':st.s==='off'?'기록 시작 전':st.s==='pending'?'아직 기록 전':st.s==='R'?`우천취소 · ${esc(st.r.rainout.reason)}`:st.auto?'기록 없음 (자동 패)':`만족 ${st.ev.okN}/${st.ev.total}${st.ev.strikes?` · 아웃 ${st.ev.strikes}`:''}`;
    days+=`<button class="wkday" ${st.s==='future'?'disabled':''} onclick="openDay('${d}')"><span><b>${WD[parse(d).getDay()]}</b> <span class="muted">${fmtShort(d)}</span></span><span>${st.s==='future'||st.s==='off'?'':badge(st)}</span><span class="muted">${info}${(()=>{const dn=dayNet(d);return dn&&dn.n?` <span class="wknet ${dn.n<0?'neg':''}">${stickerChip(dn.type)}${signed(dn.n)}</span>`:''})()}</span></button>`}
  // season by week
  const rows=[];let cw=0,cl=0;
  for(let w=weekStart(S.season.start);w<=T;w=addDays(w,7)){const e=addDays(w,6),x=tally(w,e<T?e:T);cw+=x.W;cl+=x.L;rows.push({w,x,cum:cw+cl?cw/(cw+cl):null})}
  $('#view').innerHTML=`<div class="wrap page">
    <section class="card"><div class="datebar">
      <button class="icon-btn" onclick="moveWeek(-1)" aria-label="지난주">‹</button>
      <div class="d" style="font-size:18px">${fmtShort(ws)} – ${fmtShort(we)}</div>
      <button class="icon-btn" onclick="moveWeek(1)" aria-label="다음주" ${we>=T?'disabled':''}>›</button></div>
      <div class="score" style="margin-top:14px;border-color:var(--line)">
        <div><span class="muted">이번 주 성적</span><b style="font-family:var(--display);font-size:20px">${t.W}승 ${t.L}패</b></div>
        <div style="border-color:var(--line)"><span class="muted">우천취소</span><b style="font-family:var(--display);font-size:20px">${t.R}</b></div>
        <div style="border-color:var(--line)"><span class="muted">주간 승률</span><b class="mono" style="font-size:20px;color:var(--red)">${fmtPct(t.pct)}</b></div>
      </div>
    </section>
    <section class="card">${days}</section>
    <section class="card"><div class="head"><h2>시즌 주차별 기록</h2><span class="muted">기록 시작 ${S.season.start}</span></div>
      <div class="tablewrap"><table><thead><tr><th>주차</th><th>승</th><th>패</th><th>우취</th><th>주간</th><th>누적</th></tr></thead><tbody>
      ${rows.reverse().map((r,i)=>`<tr><td>${rows.length-i}주차 <span class="muted">${fmtShort(r.w)}</span></td><td>${r.x.W}</td><td>${r.x.L}</td><td>${r.x.R}</td><td class="mono">${fmtPct(r.x.pct)}</td><td class="mono"><b>${fmtPct(r.cum)}</b></td></tr>`).join('')}
      </tbody></table></div></section>
  </div>`;
}
function moveWeek(n){const w=addDays(viewWeek,7*n);if(w>todayStr())return;viewWeek=w;renderWeek()}

/* ---------- settings menu ---------- */
function subHead(t,desc){return `<div style="display:grid;gap:4px">${tour&&tour.step>=0?tourStepHtml():'<a class="back" href="#more">‹ 설정</a>'}<h1 class="title">${t}</h1>${desc?`<p class="muted" style="margin:0">${desc}</p>`:''}</div>`}
function renderMore(){
  const n=Object.keys(S.records).length;
  $('#view').innerHTML=`<div class="wrap page"><h1 class="title">설정</h1>
    <section class="card menu">
      <a href="#look"><span><b>홈 화면 꾸미기</b><span class="muted">응원 문구 · 감독 소개 · 색상 · 글씨체</span></span>›</a>
      <a href="#exercises"><span><b>운동 설정</b><span class="muted">${S.exercises.length}이닝 · 운동 종류, 하루 목표, 단위</span></span>›</a>
      <a href="#rewards"><span><b>보상 설정</b><span class="muted">${S.reward.periodDays}일씩 타자·투수 번갈아 · 스티커 기준과 영입 가격</span></span>›</a>
      <a href="#players"><span><b>선수 명단</b><span class="muted">${esc(S.team)} 타자 ${S.batters.length}명 · 투수 ${S.pitchers.length}명 · 사진</span></span>›</a>

const STOPWORDS=new Set('명단 엔트리 선발 불펜 마무리 구원 외국인 신인 선수 선수명 이름 성명 순위 팀 팀명 구단 합계 평균 기록 기록실 타자 투수 포수 내야수 외야수 지명타자 감독 코치 등번호 생년월일 신장 체중 포지션 우투우타 우투좌타 좌투좌타 좌투우타 우언우타 좌언좌타 육성선수 타이거즈 라이온즈 트윈스 베어스 위즈 랜더스 자이언츠 이글스 다이노스 히어로즈 시즌 정규시즌 전체 경기 타율 출루율 장타율 평균자책점 승리 패배 세이브 홀드 이닝 삼진 볼넷 안타 홈런 타점 득점 도루'.split(' '));
const TEAM_MAP={KIA:'KIA','기아':'KIA','삼성':'삼성',LG:'LG','두산':'두산',KT:'KT',SSG:'SSG','롯데':'롯데','한화':'한화',NC:'NC','키움':'키움'};
const teamOf=tok=>TEAM_MAP[tok]||TEAM_MAP[String(tok).toUpperCase()]||null;
const NUM_RE=/^[+-]?(\d+(\.\d+)?|\.\d+)$/;
const isName=x=>/^[가-힣]{2,6}$/.test(x)&&!STOPWORDS.has(x)&&!teamOf(x);
function tokenize(l){return(l.includes('\t')?l.split('\t'):l.split(/\s+/)).map(x=>x.trim().replace(/\(.*?\)/g,'').replace(/^[*#·•]+/,'').replace(/,/g,'')).filter(Boolean)}
/* finds names (and the OPS/WAR column when a header row names it) in copied tables or PDF text */
function parseRoster(text,type){
  const key=TYPE[type].stat.toUpperCase(),out=[],seen=new Set();let head=null,statIdx=-1,nameIdx=-1,teamIdx=-1,multi=0;
  for(const line of String(text).split(/\r?\n/)){const tk=tokenize(line.trim());if(!tk.length)continue;
    const si=tk.map(x=>x.toUpperCase()).indexOf(key);
    if(si>=0&&!tk.some(x=>NUM_RE.test(x))){head=tk;statIdx=si;nameIdx=tk.findIndex(x=>/^(선수명|선수|이름|성명|NAME)$/i.test(x));teamIdx=tk.findIndex(x=>/^(팀명|팀|구단|TEAM)$/i.test(x));continue}
    const aligned=head&&tk.length===head.length;
    let name=aligned&&nameIdx>=0?tk[nameIdx]:null;if(!name||!isName(name))name=tk.find(isName)||null;
    if(!name||seen.has(name))continue;
    let team=aligned&&teamIdx>=0?teamOf(tk[teamIdx]):null;if(!team)for(const x of tk){const t=teamOf(x);if(t){team=t;break}}
    let stat=null;
    if(head){const v=aligned?tk[statIdx]:tk[tk.length-(head.length-statIdx)];if(v!=null&&NUM_RE.test(v))stat=Number(v)}
    else{const nums=tk.filter(x=>NUM_RE.test(x)&&x.includes('.'));if(nums.length===1)stat=Number(nums[0]);else if(nums.length>1)multi++}
    seen.add(name);out.push({name,stat,team,on:true})}

/* PDF: pdf.js from cdnjs, loaded only when a PDF is picked; runs in the page (no worker file needed) */
let pdfjsP=null;
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('load'));document.head.appendChild(s)})}
function loadPdfjs(){if(!pdfjsP){const b='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';pdfjsP=loadScript(b+'pdf.worker.min.js').then(()=>loadScript(b+'pdf.min.js')).then(()=>window.pdfjsLib);pdfjsP.catch(()=>{pdfjsP=null})}return pdfjsP}
async function openPdf(file){const lib=await loadPdfjs();return lib.getDocument({data:new Uint8Array(await file.arrayBuffer()),isEvalSupported:false}).promise}
async function pdfText(pdf){const out=[],n=Math.min(pdf.numPages,30);
  for(let p=1;p<=n;p++){const page=await pdf.getPage(p),tc=await page.getTextContent(),rows=[];
    tc.items.forEach(it=>{if(!it.str||!it.str.trim())return;const x=it.transform[4],y=it.transform[5];let r=rows.find(r=>Math.abs(r.y-y)<3);if(!r){r={y,items:[]};rows.push(r)}r.items.push({x,w:it.width||0,s:it.str})});
    rows.sort((a,b)=>b.y-a.y).forEach(r=>{r.items.sort((a,b)=>a.x-b.x);let line='',end=null;r.items.forEach(i=>{if(end!=null&&i.x-end>2)line+='\t';line+=i.s;end=i.x+i.w});out.push(line)})}
  return out.join('\n')}
async function pdfImages(pdf){const n=Math.min(pdf.numPages,Math.max(1,sampleMax),4),blobs=[];
  for(let p=1;p<=n;p++){const page=await pdf.getPage(p),v0=page.getViewport({scale:1}),v=page.getViewport({scale:Math.min(2.5,1600/v0.width)});
    const c=document.createElement('canvas');c.width=Math.ceil(v.width);c.height=Math.ceil(v.height);const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);
    await page.render({canvasContext:ctx,viewport:v}).promise;blobs.push(await new Promise(r=>c.toBlob(r,'image/jpeg',.85)))}
  return blobs}
async function bulkFile(input){const f=input.files&&input.files[0];input.value='';if(!f)return;

    if(!sampleImgs){bulkMsg('사진은 Claude가 읽어야 해서 지금은 쓸 수 없어요. 표를 복사해 붙여넣거나 PDF를 써 주세요.',true);return}

  bulk.busy=true;bulk.ctl=null;bulk.msg='PDF를 읽는 중이에요…';refreshBulk();

/* ---------- theme (three colors → full token set) ---------- */
const THEME_TOKENS=['--bg','--surface','--sunk','--ink','--muted','--line','--red','--red-ink','--red-soft','--loss','--loss-soft','--rain','--rain-soft','--board','--board-2','--board-ink','--board-muted','--board-line'];
const hex2rgb=h=>{h=h.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');const n=parseInt(h,16);return[n>>16&255,n>>8&255,n&255]};
const rgb2hex=a=>'#'+a.map(v=>Math.round(Math.max(0,Math.min(255,v))).toString(16).padStart(2,'0')).join('');
const mix=(a,b,t)=>{const x=hex2rgb(a),y=hex2rgb(b);return rgb2hex(x.map((v,i)=>v+(y[i]-v)*t))};
const lum=h=>{const c=hex2rgb(h).map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*c[0]+.7152*c[1]+.0722*c[2]};
const contrast=(a,b)=>{const x=lum(a),y=lum(b);return(Math.max(x,y)+.05)/(Math.min(x,y)+.05)};
const validHex=h=>/^#[0-9a-f]{6}$/i.test(h||'');
function applyTheme(t){const r=document.documentElement;
  if(!t||!validHex(t.bg)||!validHex(t.fg)||!validHex(t.accent)){THEME_TOKENS.forEach(k=>r.style.removeProperty(k));r.style.removeProperty('color-scheme');return}
  const{bg,fg,accent}=t,dark=lum(bg)<.35;
  const surface=dark?mix(bg,fg,.07):bg,page=dark?bg:mix(bg,fg,.045);
  const board=dark?mix(bg,fg,.02):fg,boardInk=dark?fg:bg,rain=dark?'#5e9fe6':'#2c6db0';
  const v={'--bg':page,'--surface':surface,'--sunk':mix(surface,fg,.07),'--ink':fg,'--muted':mix(fg,bg,.42),'--line':mix(surface,fg,.14),
    '--red':accent,'--red-ink':contrast(accent,'#ffffff')>=contrast(accent,'#000000')?'#ffffff':'#000000','--red-soft':mix(page,accent,.16),
    '--loss':mix(fg,bg,.45),'--loss-soft':mix(surface,fg,.08),'--rain':rain,'--rain-soft':mix(page,rain,.16),
    '--board':board,'--board-2':mix(board,accent,.32),'--board-ink':boardInk,'--board-muted':mix(boardInk,board,.38),'--board-line':mix(board,boardInk,.18)};
  Object.entries(v).forEach(([k,x])=>r.style.setProperty(k,x));r.style.setProperty('color-scheme',dark?'dark':'light')}

function ddayInfo(dateStr){if(!dateStr)return null;const n=Math.round((parse(dateStr)-parse(todayStr()))/864e5);
  return{n,label:n>0?`D-${String(n).padStart(3,'0')}`:n===0?'D-DAY':`D+${String(-n).padStart(3,'0')}`}}
function ddayHtml(dateStr=S.nextSeason){const d=ddayInfo(dateStr);if(!d)return '';
  return `<div class="dday" aria-label="시즌 개막까지 ${d.n>0?d.n+'일':d.label}"><small>${d.n>0?'개막까지':'시즌 개막'}</small><b>${d.label}</b></div>`}
function parseYmd8(v){v=String(v||'').replace(/\D/g,'');if(v.length!==8)return null;const y=+v.slice(0,4),m=+v.slice(4,6),d=+v.slice(6,8);
  const dt=new Date(y,m-1,d);if(dt.getFullYear()!==y||dt.getMonth()!==m-1||dt.getDate()!==d)return null;return ymd(dt)}
function ddayPreview(v){const el=$('#ddayPrev');if(!el)return;if(!v){el.textContent='';return}

/* user's own font file (ttf/otf/woff) kept in IndexedDB, not in the backup code */
const CUSTOM_FAMILY='SpringcampCustom';
function idb(){return new Promise((res,rej)=>{try{const r=indexedDB.open('springcamp',1);r.onupgradeneeded=()=>r.result.createObjectStore('files');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}})}
async function idbReq(mode,fn){const db=await idb();return new Promise((res,rej)=>{const tx=db.transaction('files',mode),req=fn(tx.objectStore('files'));tx.oncomplete=()=>res(req&&req.result);tx.onerror=()=>rej(tx.error)})}
const idbGet=k=>idbReq('readonly',st=>st.get(k)),idbSet=(k,v)=>idbReq('readwrite',st=>st.put(v,k)),idbDel=k=>idbReq('readwrite',st=>st.delete(k));
function dropCustomFace(){try{const old=[];document.fonts.forEach(f=>{if(f.family.replace(/["']/g,'')===CUSTOM_FAMILY)old.push(f)});old.forEach(f=>document.fonts.delete(f))}catch(e){}}
async function installCustomFont(buf){const ff=new FontFace(CUSTOM_FAMILY,buf);await ff.load();dropCustomFace();document.fonts.add(ff)}
async function bootCustomFont(){if(!S.customFont)return;try{const v=await idbGet('customFont');if(v&&v.buf){await installCustomFont(v.buf.slice(0));if(location.hash==='#look')renderLook()}}catch(e){}}
async function pickCustomFont(input){const f=input.files&&input.files[0];if(!f)return;
  if(f.size>25*1024*1024){toast('글씨체 파일이 너무 커요. 25MB 이하 파일을 골라 주세요');return}
  toast('글씨체를 불러오는 중이에요…');
  try{const buf=await f.arrayBuffer();await installCustomFont(buf.slice(0));await idbSet('customFont',{name:f.name,buf});
    S.customFont={name:f.name.replace(/\.(ttf|otf|woff2?)$/i,'')};persist();
    lookDraft.fonts={display:'custom',body:'custom'};renderLook();toast('내 글씨체를 적용했어요. 아래 저장을 눌러 주세요')}
  catch(e){toast('이 파일은 글씨체로 읽을 수 없어요. ttf, otf, woff 파일인지 확인해 주세요')}}
async function removeCustomFont(){try{await idbDel('customFont')}catch(e){}dropCustomFace();S.customFont=null;
  ['display','body'].forEach(k=>{if(S.fonts[k]==='custom')S.fonts[k]=FONTS[k][0].id;if(lookDraft&&lookDraft.fonts[k]==='custom')lookDraft.fonts[k]=FONTS[k][0].id});
  persist();applyFonts(lookDraft?lookDraft.fonts:S.fonts);renderLook();toast('내 글씨체를 지웠어요')}
const fontList=kind=>S.customFont?[{id:'custom',name:'내 글씨체 · '+S.customFont.name,family:CUSTOM_FAMILY,q:null},...FONTS[kind]]:FONTS[kind];
const fontLoaded=new Set(['Black+Han+Sans','Noto+Sans+KR:wght@400;500;700']);
function loadFont(q){if(!q||fontLoaded.has(q))return;fontLoaded.add(q);const l=document.createElement('link');l.rel='stylesheet';l.href='https://fonts.googleapis.com/css2?family='+q+'&display=swap';document.head.appendChild(l)}
const fontOf=(kind,id)=>fontList(kind).find(f=>f.id===id)||FONTS[kind][0];
function applyFonts(f){f=f||{};const r=document.documentElement,dsp=fontOf('display',f.display),bdy=fontOf('body',f.body);
  loadFont(dsp.q);loadFont(bdy.q);
  r.style.setProperty('--display',`'${dsp.family}','Noto Sans KR',system-ui,sans-serif`);
  r.style.setProperty('--body',`'${bdy.family}',system-ui,-apple-system,'Apple SD Gothic Neo',sans-serif`)}

    <section class="card"><div class="head"><h2>색상</h2></div>
      <div class="presets" style="margin-bottom:14px">${PRESETS.map((x,i)=>`<button class="preset" onclick="applyPreset(${i})"><i><b style="background:${x.t.bg}"></b><b style="background:${x.t.fg}"></b><b style="background:${x.t.accent}"></b></i>${x.name}</button>`).join('')}</div>
      ${ROLES.map(([k,label])=>`<div class="swrow"><div class="lbl">${label}<span class="muted mono">${L.theme[k].toUpperCase()}</span></div>
        <div class="swatches">${SWATCHES.map(([n,c])=>`<button class="sw" style="background:${c}" aria-label="${label} ${n}" aria-pressed="${L.theme[k].toLowerCase()===c}" onclick="setColor('${k}','${c}')"></button>`).join('')}
        <input type="color" id="lk-${k}" value="${L.theme[k]}" aria-label="${label} 직접 고르기" oninput="setColor('${k}',this.value,true)"></div></div>`).join('')}
      <p class="warn" id="lookWarn" ${contrast(L.theme.bg,L.theme.fg)<4.5?'':'hidden'}>배경색과 글자색이 비슷해서 글자가 잘 안 보일 수 있어요.</p>
    </section>
    <section class="card" style="display:grid;gap:10px"><h2>글씨체</h2>
      <div class="customfont"><div style="min-width:0"><b>내 글씨체 파일</b><br><span class="muted">${S.customFont?esc(S.customFont.name)+' 불러옴':'ttf · otf · woff'}</span></div>
        <div class="row" style="flex:none"><label class="filebtn" for="lk-font">${S.customFont?'바꾸기':'파일 선택'}</label><input type="file" id="lk-font" onchange="pickCustomFont(this)">${S.customFont?'<button class="btn ghost" style="padding:7px 10px" onclick="removeCustomFont()">삭제</button>':''}</div></div>
      <p class="muted" style="margin:0">제목·숫자</p>
      ${fontOptsHtml('display',L.fonts.display)}
      <p class="muted" style="margin:6px 0 0">본문</p>
      ${fontOptsHtml('body',L.fonts.body)}
    </section>
    <div class="row own-save"><button class="btn" style="flex:1" onclick="lookDraft=null;applyTheme(S.theme);applyFonts(S.fonts);renderLook()">되돌리기</button><button class="btn primary" style="flex:2" onclick="saveLook()">저장</button></div>
  </div>`;
  applyTheme(L.theme);applyFonts(L.fonts);[...FONTS.display,...FONTS.body].forEach(f=>loadFont(f.q));
}
function lookRefresh(){$('#lookPreview').innerHTML=heroHtml(lookDraft,false)}
function setColor(k,c,fromPicker){lookDraft.theme[k]=c.toLowerCase();if(fromPicker){applyTheme(lookDraft.theme);lookRefresh();const w=$('#lookWarn');if(w)w.hidden=contrast(lookDraft.theme.bg,lookDraft.theme.fg)>=4.5}else renderLook()}
function applyPreset(i){lookDraft.theme={...PRESETS[i].t};renderLook()}
function pickProfilePhoto(input){const f=input.files&&input.files[0];if(!f)return;
  const fr=new FileReader();fr.onload=()=>{const img=new Image();img.onload=()=>{const s=240,c=document.createElement('canvas');c.width=c.height=s;
    const k=Math.max(s/img.width,s/img.height),w=img.width*k,h=img.height*k;c.getContext('2d').drawImage(img,(s-w)/2,(s-h)/2,w,h);
    lookDraft.profile.photo=c.toDataURL('image/jpeg',.85);renderLook()};img.onerror=()=>toast('이 파일은 이미지로 열 수 없어요');img.src=fr.result};fr.readAsDataURL(f)}
function saveLook(){const L=lookDraft;
  S.home={slogan:(L.slogan||'').trim()||'최강기아 승리하리라',profile:{...L.profile,nick:(L.profile.nick||'').trim(),from:(L.profile.from||'').trim(),age:(L.profile.age||'').trim(),etc:(L.profile.etc||'').trim()}};S.theme={...L.theme};S.fonts={...L.fonts};
  if(persist()){lookDraft=null;toast('홈 화면을 저장했어요');renderLook();return true}return false}

/* ---------- first-run tutorial ---------- */
/* Texts for the first two screens: replace freely. Line breaks in body become new lines. */
const TUTORIAL={
  why:{eyebrow:'OFF SEASON',title:'야구 없는 겨울,\n심심하신가요?',body:'노노! 지금은 응원 체력을 기를 때예요.\n매일 운동으로 나와의 경기에서 이기고, 승률을 쌓고, 선수를 영입해 최고의 라인업을 만드세요.\n다음 시즌엔 챔필 무한계단도 끄떡없을 거예요!'},
  rules:{eyebrow:'HOW TO WIN',title:'하루는 한 경기',body:'운동 종류와 목표량을 정하고, 목표를 채우면 승리!\n이길수록 승률이 오르고 선수 영입 스티커가 쌓여요.\n스티커가 많을수록 더 좋은 선수를 데려올 수 있어요.\n개막일까지 나만의 라인업과 불펜을 완성해서 우승을 노려 보세요!'}};
const TOUR_STEPS=[
  {route:'look',name:'홈 화면',save:()=>saveLook()},
  {route:'exercises',name:'운동 목표',save:()=>saveEx()},
  {route:'rules',name:'승리 기준',save:()=>saveRules()},
  {route:'rewards',name:'보상',save:()=>saveRewards()},
  {route:'players',name:'선수',save:()=>saveRewards()}];
let tour=null;
const nl2br=t=>esc(t).replace(/\n/g,'<br>');
function startTour(){tour={step:-2};renderTour()}
function tourStepHtml(){return `<div class="tourstep"><span>처음 설정 ${tour.step+1}/${TOUR_STEPS.length} · ${TOUR_STEPS[tour.step].name}</span><i>${TOUR_STEPS.map((_,i)=>`<b class="${i<=tour.step?'on':''}"></b>`).join('')}</i></div>`}
function introHtml(step){const T=step===-2?TUTORIAL.why:TUTORIAL.rules,dots=[-2,-1,0].map(i=>`<b class="${i===step?'on':''}"></b>`).join('');
  const demo=step===-1?`<div class="tdemo"><div class="linescore">${['ok','ok','ok','part','ok','ok','k','ok','ok'].map((c,i)=>`<span class="ls ${c}"><small>${i+1}</small><b>${c==='ok'?'●':c==='k'?'아웃':'62'}</b></span>`).join('')}</div>
    <p><span class="res W">승</span> 9이닝 중 7이닝 만족 · 아웃 1</p></div>`:`<svg class="tball" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><circle cx="12" cy="12" r="9"/><path d="M7 5.5c2 2.2 2 10.8 0 13M17 5.5c-2 2.2-2 10.8 0 13" stroke-dasharray="1.6 1.6"/></svg>`;
  return `<div class="tin"><button class="tskip" onclick="skipTour()">건너뛰기</button>
    <div class="tbody"><small class="teyebrow">${esc(T.eyebrow)}</small><h1 class="ttitle">${nl2br(T.title)}</h1>${demo}<p class="ttext">${nl2br(T.body)}</p></div>
    <div class="tfoot"><i class="tdots">${dots}</i><div class="row">${step===-1?'<button class="btn tback" onclick="tourGo(-2)">이전</button>':''}<button class="btn primary tnext" onclick="tourGo(${step+1})">${step===-1?'내 팀 설정 시작':'다음'}</button></div></div></div>`}
function renderTour(){const el=$('#tour'),bar=$('#tourbar');document.body.classList.toggle('touring',!!tour);
  if(!tour){el.hidden=true;el.innerHTML='';bar.hidden=true;bar.innerHTML='';return}
  if(tour.step<0){bar.hidden=true;el.innerHTML=introHtml(tour.step);el.hidden=false;el.scrollTop=0;return}
  el.hidden=true;el.innerHTML='';const last=tour.step===TOUR_STEPS.length-1;bar.hidden=false;
  bar.innerHTML=`<div class="in"><button class="btn" onclick="tourGo(${tour.step-1})">‹ 이전</button><button class="btn ghost" onclick="tourGo(${tour.step+1})">${last?'건너뛰고 시작':'건너뛰기'}</button><button class="btn primary" onclick="tourNext()">${last?'저장하고 시작':'저장하고 다음'}</button></div>`;
  const r=TOUR_STEPS[tour.step].route;if(location.hash!=='#'+r)location.hash=r;else route()}
function tourGo(i){if(!tour)return;if(i>=TOUR_STEPS.length){finishTour();return}tour.step=Math.max(-2,i);renderTour()}
function tourNext(){const ok=TOUR_STEPS[tour.step].save();if(ok===false)return;tourGo(tour.step+1)}
function finishTour(skipped){S.onboarded=true;persist();tour=null;renderTour();if(location.hash==='#home'||!location.hash)route();else location.hash='home';
  toast(skipped?'설정은 언제든 설정 탭에서 바꿀 수 있어요':'설정을 마쳤어요. 오늘 첫 경기를 시작해 볼까요?')}
function skipTour(){finishTour(true)}

/* ---------- routing ---------- */
const ROUTES={players:()=>renderRewards('players'),home:renderHome,dex:renderDex,team:renderTeam,look:renderLook,record:renderRecord,week:renderWeek,more:renderMore,exercises:renderExercises,rewards:()=>renderRewards('rewards'),rules:renderRules};
const TAB_OF={players:'more',team:'dex',look:'more',exercises:'more',rewards:'more',rules:'more'};
let lastRoute='';
function route(){const h=(location.hash||'#home').slice(1),r=ROUTES[h]?h:'home';
  if(r!=='exercises')exDraft=null;if(r!=='team'){teamEdit=false;lineupDraft=null}closeSheet();if(r!=='rewards'&&r!=='players')rwDraft=null;else if(lastRoute&&lastRoute!==r)rwDraft=null;if(r!=='look'&&lookDraft){lookDraft=null;applyTheme(S.theme);applyFonts(S.fonts)}
  if(r==='record'&&lastRoute!=='record'&&!cur.draft)cur.date=cur.date||todayStr();
  ROUTES[r]();const tab=TAB_OF[r]||r;
  document.querySelectorAll('.tabbar a').forEach(a=>a.classList.toggle('on',a.dataset.tab===tab));
  if(r!==lastRoute)window.scrollTo(0,0);lastRoute=r}
document.querySelector('.tabbar a[data-tab=record]').addEventListener('click',()=>{if(location.hash!=='#record'){cur.date=todayStr();cur.draft=null}});
window.addEventListener('hashchange',route);
backfillStickers();
applyTheme(S.theme);applyFonts(S.fonts);
route();
if(!S.onboarded)startTour();
bootCustomFont();
</script>

<script>
/* PWA: offline support, keep data from being cleared, status bar color follows theme */
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
(function(){const orig=applyTheme;window.applyTheme=applyTheme=function(t){orig(t);const m=document.querySelector('meta[name=theme-color]');if(m)m.content=(t&&t.bg)||'#10233f'};applyTheme(S.theme)})();
</script>
</body>
</html>
